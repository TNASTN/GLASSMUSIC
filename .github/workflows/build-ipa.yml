name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Web Dir & Config
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            python3 -c "import server; open('www/index.html', 'w', encoding='utf-8').write(server.HTML_CONTENT)" 2>/dev/null || echo "<h1>GlassAudio</h1>" > www/index.html
          fi

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Setup Capacitor iOS
        run: |
          npx cap init "GlassAudio" "com.glassaudio.app" --web-dir www
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r GlassAudio.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassAudio-IPA
          path: ios/App/GlassAudio.ipa
          
